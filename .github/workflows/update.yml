name: Update VPN Gate list
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download list
        run: |
          curl -fsSL --retry 3 --max-time 120 -A "Mozilla/5.0" https://www.vpngate.net/api/iphone/ -o new.csv
          grep -q "#HostName" new.csv
          mv new.csv servers.csv
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add servers.csv
          git commit -m "update" || exit 0
          git push
